name: Publish Atomm release

# The Atomm package releases with the web app under the same version. When a
# production CI run on main succeeds, publish that run's verified package as
# atomm-v<version> unless that release already exists. A manual run can
# publish a specific run's package, for example to retry after a failure.
on:
  workflow_run:
    workflows: ["CI and Worker Deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run ID containing the production Atomm package
        type: string
        required: true
      tag:
        description: Tag matching the artifact version, for example atomm-v0.3.0
        type: string
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-atomm-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tested commit, so the version and changelog match the package.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        # Inline rather than the local setup action: this job checks out the
        # commit a CI run built, which may predate the action.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The release notes read the changelog through the shared contracts package.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Choose the CI run and tag
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_RUN: ${{ inputs.ci_run_id }}
          INPUT_TAG: ${{ inputs.tag }}
          WORKFLOW_RUN: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            RUN_ID="$INPUT_RUN"; TAG="$INPUT_TAG"
          else
            RUN_ID="$WORKFLOW_RUN"; TAG="atomm-v$(node -p "require('./package.json').version")"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # A promotion that did not change the version finds its release published.
          if [ "$EVENT" = workflow_run ] && [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "$TAG is already published."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify production artifact and publish versioned release
        if: steps.target.outputs.skip != 'true'
        run: node scripts/release/publish-atomm-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ATOMM_CI_RUN_ID: ${{ steps.target.outputs.run_id }}
          ATOMM_RELEASE_TAG: ${{ steps.target.outputs.tag }}
