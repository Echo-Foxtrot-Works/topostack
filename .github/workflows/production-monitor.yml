name: Production Monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  canary:
    name: Production canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./.github/actions/setup-node-deps
        with:
          install: "false"

      # Both verifiers import node: builtins only, so this hourly job needs no
      # `npm ci` (Playwright, wrangler, Svelte). The jsdom-based SEO checks run
      # in the daily browser monitor and after every deploy.
      - name: Verify production frontend, API, and data providers
        run: node scripts/verify/verify-worker-deployment.mjs
        env:
          WORKER_URL: https://topostack.app
          PUBLIC_APP_URL: https://topostack.app
          EXPECTED_WORKER_ENVIRONMENT: production

      - name: Verify uncached upstream probe freshness
        run: node scripts/verify/verify-upstream-health.mjs
        env:
          WORKER_URL: https://topostack.app
