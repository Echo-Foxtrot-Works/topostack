name: Production Browser Monitor

on:
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-browser-monitor
  cancel-in-progress: false

jobs:
  browser-canary:
    name: Live generation canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./.github/actions/setup-node-deps
        with:
          npm-ci-args: ""

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      # Browser binaries are versioned with Playwright; system libraries are
      # not cached, so a cache hit still installs them.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Generate terrain in production
        run: npm run test:e2e:live
        env:
          PUBLIC_APP_URL: https://topostack.app

      - name: Build core for the data benchmark
        run: npm run build -w @topostack/core

      - name: Measure cold and warm data loading
        run: npm run data:benchmark
        env:
          PUBLIC_APP_URL: https://topostack.app
          DATA_BENCHMARK_OUTPUT: test-results-live/data-benchmark.json

      # Runs here rather than in the hourly canary: it needs jsdom and the
      # generator sources, which is the only reason that job would install.
      - name: Verify production search metadata over HTTP
        run: node scripts/verify/verify-seo-http.mjs https://topostack.app production

      - name: Retain data benchmark
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-data-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results-live/data-benchmark.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results-live
          if-no-files-found: ignore
          retention-days: 7
