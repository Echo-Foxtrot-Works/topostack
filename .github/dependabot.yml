version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    # TypeScript 7 is outside the supported peer ranges of SvelteKit,
    # svelte-check, and typescript-eslint. Revisit when those tools support it.
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0 <8.0.0"]
      # Cloudflare's Worker test pool supports Vitest 4. Upgrade the runner
      # and both coverage providers together after the pool supports Vitest 5.
      - dependency-name: vitest
        versions: [">=5.0.0 <6.0.0"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=5.0.0 <6.0.0"]
      - dependency-name: "@vitest/coverage-istanbul"
        versions: [">=5.0.0 <6.0.0"]
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday

  # The Python data builders' one pinned environment. Monthly: these run by
  # hand and an upgrade means re-checking the archives they build.
  # nest-wasm's Cargo.lock is left out on purpose: any change to it needs the
  # committed WebAssembly rebuilt (`npm run build:nest-wasm`), so it is
  # upgraded by hand with the solver (see packages/nest-wasm/README.md).
  - package-ecosystem: pip
    directory: "/scripts/data-build"
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      python-builders:
        patterns: ["*"]
